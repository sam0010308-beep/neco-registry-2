name: Build NECO Console Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["*.py", "pyproject.toml", ".github/workflows/windows.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install dependencies
        run: python -m pip install . pyinstaller
      - name: Check syntax
        run: python -m py_compile terminal_ui.py registry.py
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name NECO-Registry --collect-all textual --collect-all pymorphy3 --collect-all pymorphy3_dicts_ru terminal_ui.py
      - name: Check executable
        shell: pwsh
        run: |
          $exe = Get-Item "dist/NECO-Registry.exe" -ErrorAction Stop
          if ($exe.Length -lt 1MB) { throw "Executable missing or unexpectedly small" }
      - uses: actions/upload-artifact@v4
        with:
          name: NECO-Registry-Windows
          path: dist/NECO-Registry.exe
          if-no-files-found: error
